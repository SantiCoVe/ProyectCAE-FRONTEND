<div class="card-folder" (click)="onClick()">
  <lucide-angular
    [img]="FolderIcon"
    [size]="22"
    class="card-folder__icon"
    aria-hidden="true"
  />
  <div class="card-folder__info">
    <span class="card-folder__name">{{ name }}</span>
    <span class="card-folder__count">{{ itemCount }} elementos</span>
  </div>
</div>
