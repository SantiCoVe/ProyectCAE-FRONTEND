<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-card__brand">
      <div class="auth-card__logo">
        <lucide-angular [img]="UserPlusIcon" [size]="24" />
      </div>
      <span class="auth-card__app-name">ProyectCAE</span>
    </div>

    <div class="auth-card__header">
      <h1 class="auth-card__title">Crear cuenta</h1>
      <p class="auth-card__subtitle">Completa los datos para registrarte</p>
    </div>

    <div class="auth-card__error" *ngIf="error">
      {{ error }}
    </div>

    <div class="auth-card__form">
      <div class="field">
        <label class="field__label">Nombre completo</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="UserIcon" [size]="16" class="field__icon" />
          <input class="field__input" type="text" placeholder="Tu nombre" [(ngModel)]="name" />
        </div>
      </div>

      <div class="field">
        <label class="field__label">Correo electrónico</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="MailIcon" [size]="16" class="field__icon" />
          <input class="field__input" type="email" placeholder="correo@ejemplo.com" [(ngModel)]="email" />
        </div>
      </div>

      <div class="field">
        <label class="field__label">Contraseña</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="LockIcon" [size]="16" class="field__icon" />
          <input
            class="field__input"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="password"
          />
          <button class="field__toggle" type="button" (click)="togglePassword()">
            <lucide-angular [img]="showPassword ? EyeOffIcon : EyeIcon" [size]="16" />
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field__label">Confirmar contraseña</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="LockIcon" [size]="16" class="field__icon" />
          <input
            class="field__input"
            [type]="showConfirm ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="confirmPassword"
          />
          <button class="field__toggle" type="button" (click)="toggleConfirm()">
            <lucide-angular [img]="showConfirm ? EyeOffIcon : EyeIcon" [size]="16" />
          </button>
        </div>
      </div>

      <button class="auth-btn" [class.auth-btn--loading]="loading" (click)="onSubmit()">
        <span *ngIf="!loading">Crear cuenta</span>
        <span *ngIf="loading" class="auth-btn__spinner">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="31.4" stroke-dashoffset="10"/>
          </svg>
          Creando cuenta...
        </span>
      </button>
    </div>

    <p class="auth-card__switch">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login">Inicia sesión</a>
    </p>

  </div>
</div>
