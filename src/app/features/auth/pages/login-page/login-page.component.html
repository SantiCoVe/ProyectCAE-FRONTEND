<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-card__brand">
      <span class="auth-card__app-name">ProyectCAE</span>
    </div>

    <div class="auth-card__header">
      <h1 class="auth-card__title">Bienvenido de nuevo</h1>
      <p class="auth-card__subtitle">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="auth-card__error" *ngIf="error">
      {{ error }}
    </div>

    <div class="auth-card__form">
      <div class="field">
        <label class="field__label">Correo electrónico</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="MailIcon" [size]="16" class="field__icon" />
          <input
            class="field__input"
            type="email"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email"
          />
        </div>
      </div>

      <div class="field">
        <label class="field__label">Contraseña</label>
        <div class="field__input-wrap">
          <lucide-angular [img]="LockIcon" [size]="16" class="field__icon" />
          <input
            class="field__input"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="password"
          />
          <button class="field__toggle" type="button" (click)="togglePassword()">
            <lucide-angular [img]="showPassword ? EyeOffIcon : EyeIcon" [size]="16" />
          </button>
        </div>
      </div>


      <button class="auth-btn" [class.auth-btn--loading]="loading" (click)="onSubmit()">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="auth-btn__spinner">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="31.4" stroke-dashoffset="10"/>
          </svg>
          Ingresando...
        </span>
      </button>
    </div>

    <p class="auth-card__switch">
      ¿No tienes cuenta?
      <a routerLink="/auth/register">Regístrate</a>
    </p>
      <div class="auth-card__forgot">
        <a routerLink="/auth/forgot">¿Olvidaste tu contraseña?</a>
      </div>
  </div>
  
</div>
